<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Dashboard Kinerja UPT Bengkulu</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .pln-blue { color: #0076c8; }
        .bg-pln { background-color: #0076c8; }
        .status-baik { background-color: #dcfce7; color: #166534; }
        .status-masalah { background-color: #fee2e2; color: #991b1b; }
        table { width: auto; min-width: 100%; }
        td, th { white-space: nowrap; padding: 0.5rem; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans p-4">
    <div class="max-w-[95vw] mx-auto">
        <header class="mb-4 border-b-4 border-blue-600 pb-2">
            <h1 class="text-xl font-black pln-blue">PT PLN (PERSERO) - UPT BENGKULU</h1>
            <p class="text-[9px] font-bold text-slate-500 uppercase" id="period-label">Dashboard Kinerja Operasional</p>
        </header>

        <div id="tables-container" class="space-y-6">
            <!-- Tabel Utama -->
            <div class="overflow-x-auto bg-white rounded-lg shadow border border-slate-200">
                <h2 class="bg-blue-900 text-white p-2 text-xs font-bold uppercase">Indikator Kinerja Utama</h2>
                <table class="w-full text-[9px] border-collapse" id="main-table">
                    <thead class="bg-slate-100 uppercase">
                        <tr>
                            <th>NO</th><th>INDIKATOR</th><th>BOBOT</th><th>TARGET</th><th>REALISASI</th><th>STATUS</th>
                        </tr>
                    </thead>
                    <tbody id="main-body" class="divide-y"></tbody>
                </table>
            </div>

            <!-- Tabel Kinerja Merah -->
            <div class="overflow-x-auto bg-white rounded-lg shadow border border-red-200">
                <h2 class="bg-red-800 text-white p-2 text-xs font-bold uppercase">Kinerja Merah (ABOF)</h2>
                <table class="w-full text-[9px] border-collapse" id="red-table">
                    <thead class="bg-slate-100 uppercase">
                        <tr>
                            <th>NO</th><th>PENYEBAB / FAKTOR</th><th>STATUS</th><th>TINDAK LANJUT (%)</th>
                        </tr>
                    </thead>
                    <tbody id="red-body" class="divide-y"></tbody>
                </table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/papaparse@5.3.2/papaparse.min.js"></script>
    <script>
        const sheetUrl = 'https://docs.google.com/spreadsheets/d/1GcyqF-CRESZyPRbeSObV7SWF-MseWjJtOmofF_4nPjQ/export?format=csv&gid=1877466739';
        const c = (row, i) => ((row && row[i]) !== undefined && row[i] !== null ? String(row[i]) : '').trim();
        // bulan realisasi terakhir ada di kolom 9..20 (JAN..DES)
        const lastMonth = (row) => {
            let last = '';
            for (let i = 9; i <= 20; i++) { const v = c(row, i); if (v) last = v; }
            return last;
        };
        Papa.parse(sheetUrl, {
            download: true,
            complete: function(results) {
                const mainBody = document.getElementById('main-body');
                const redBody = document.getElementById('red-body');
                const periodEl = document.getElementById('period-label');
                let inRed = false;

                results.data.forEach((row) => {
                    // Label periode dari header sheet (BULAN | AGUSTUS | 2026)
                    if (c(row, 8).toUpperCase() === 'BULAN') {
                        const m = (c(row, 9) + ' ' + c(row, 10)).trim();
                        if (m && periodEl) periodEl.textContent = 'Dashboard Kinerja Operasional (' + m + ')';
                    }
                    // Masuk blok KINERJA MERAH
                    if (row.some(cell => c([cell], 0).toUpperCase() === 'KINERJA MERAH')) { inRed = true; return; }

                    if (!inRed) {
                        // Tabel utama: NO (kol 1) digit + INDIKATOR (kol 2) terisi
                        if (/^\d+$/.test(c(row, 1)) && c(row, 2)) {
                            const status = c(row, 14);
                            mainBody.innerHTML += `<tr>
                                <td>${c(row, 1)}</td><td>${c(row, 2)}</td><td>${c(row, 3)}</td>
                                <td>${c(row, 8)}</td><td>${c(row, 9)}</td>
                                <td class="${status.includes('MASALAH') ? 'status-masalah' : 'status-baik'}">${status}</td>
                            </tr>`;
                        }
                    } else {
                        // Kinerja merah: NO digit + PENYEBAB (kol 2) terisi
                        if (/^\d+$/.test(c(row, 1)) && c(row, 2)) {
                            const status = c(row, 8);
                            redBody.innerHTML += `<tr>
                                <td>${c(row, 1)}</td><td>${c(row, 2).replace(/\n/g, ' ')}</td>
                                <td class="${status.toUpperCase().includes('CLOSE') ? 'status-baik' : 'status-masalah'}">${status}</td>
                                <td>${lastMonth(row)}</td>
                            </tr>`;
                        }
                    }
                });
            }
        });
    </script>
</body>
</html>
